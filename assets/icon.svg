    <polygon points="256,150 285,218 358,222 302,268 321,340 256,300 191,340 210,268 154,222 227,218" fill="none" stroke="#1E2238" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <clipPath id="star"><polygon points="256,150 285,218 358,222 302,268 321,340 256,300 191,340 210,268 154,222 227,218"/></clipPath>
  <g transform="rotate(38 380 380)">
