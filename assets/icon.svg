<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Malbuch's app icon: a sheet of paper on the sky-blue desk, a star painted
       inside its lines, the pen beside it. public/icon-192.png, icon-512.png
       and icon-maskable.png (art at 80 % on the sky colour) are renderings of
       this file. -->
  <rect width="512" height="512" fill="#BFE0FF"/>
  <g fill="#A8D1FA">
    <circle cx="40" cy="40" r="7"/><circle cx="96" cy="40" r="7"/><circle cx="152" cy="40" r="7"/><circle cx="208" cy="40" r="7"/><circle cx="264" cy="40" r="7"/><circle cx="320" cy="40" r="7"/><circle cx="376" cy="40" r="7"/><circle cx="432" cy="40" r="7"/><circle cx="488" cy="40" r="7"/>
    <circle cx="40" cy="472" r="7"/><circle cx="96" cy="472" r="7"/><circle cx="152" cy="472" r="7"/><circle cx="208" cy="472" r="7"/><circle cx="264" cy="472" r="7"/><circle cx="320" cy="472" r="7"/><circle cx="376" cy="472" r="7"/><circle cx="432" cy="472" r="7"/><circle cx="488" cy="472" r="7"/>
  </g>
  <g id="art" transform="rotate(-6 256 256)">
    <rect x="118" y="88" width="276" height="336" rx="30" fill="#8BBDEB" transform="translate(0 14)"/>
