<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it env(safe-area-inset-*) is 0 on iOS and
         the notch and home-indicator padding does nothing. No pinch zoom: a
         second finger on the paper must never zoom the page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Ausmalen ohne Übermalen: Malbuch für Kinder von 3 bis 8, offline auf dem Tablet." />
    <meta name="theme-color" content="#a71f65" />
    <title>Malbuch</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Before the stylesheet: applies a forced light/dark choice before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
